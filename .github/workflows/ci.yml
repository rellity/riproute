name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # The adapters and the plugin ship built; the suite resolves the
            # workspace through them, and the example builds against the plugin.
            - run: pnpm build

            - run: pnpm format:check
            - run: pnpm test

            # The checks that matter most need a real browser against a real server:
            # a failed hydration is only a console warning, and a lost outlet anchor
            # only shows up on the second render.
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
