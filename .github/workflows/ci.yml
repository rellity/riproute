name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # `npm ci` runs `prepare`, which builds dist/ — the example links to this
            # package and imports the built plugin from it.
            - run: npm ci
            - run: npm ci --prefix example

            - run: npm run format:check
            - run: npm test

            # The checks that matter most need a real browser against a real server:
            # a failed hydration is only a console warning, and a lost outlet anchor
            # only shows up on the second render.
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
